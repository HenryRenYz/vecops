schema = "memory-model/0.3"
name = "8x H800 NVLink"

# 带宽数值统一为 GiB/s；大小与时间显式标注。

[units]
bandwidth = "GiB/s"

[require]
gpu_model = "H800"
gpu_count = 8
peer_fabric = "nvlink"

[groups]
node = { count = "runtime" }

[agents]
gpu = { per = "node", count = 8, bind = "gpu" }

[pools]
hbm = { per = "gpu", capacity = "discover", bind = "device-memory", service = "hbm" }
host = { per = "node", capacity = "discover", bind = "pinned-host-memory", read_service = "host_read", write_service = "host_write" }

[resources]
hbm = { per = "gpu", bandwidth = 2224.83 }
pcie_tx = { per = "gpu", bandwidth = 50.67 }
pcie_rx = { per = "gpu", bandwidth = 51.38 }
host_read = { per = "node", bandwidth = 199.77 }
host_write = { per = "node", bandwidth = 107.94 }
peer_tx = { per = "gpu", bandwidth = 163.21 }
peer_rx = { per = "gpu", bandwidth = 164.6 }

[paths]
device_access = { agent = "gpu", pool = "hbm", where = "local" }

[transfers]
p2p = { from = "hbm", to = "hbm", by = "source.gpu", where = "different(gpu)", within = "node", use = ["source.peer_tx", "target.peer_rx"], bandwidth = 163.74 }
h2d = { from = "host", to = "hbm", by = "target.gpu", within = "node", use = ["target.pcie_rx"], bandwidth = 51.38 }
d2h = { from = "hbm", to = "host", by = "source.gpu", within = "node", use = ["source.pcie_tx"], bandwidth = 50.67 }
