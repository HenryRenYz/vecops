# Schema example, not measured hardware. Replace OS IDs before use.
[topology]
schema_version = 1
root = "host"
[[topology.domains]]
id = "s0"
kind = "socket"
parent = "host"
[[topology.domains]]
id = "s1"
kind = "socket"
parent = "host"
[[topology.domains]]
id = "s0.d0"
kind = "die"
parent = "s0"
[[topology.domains]]
id = "s1.d0"
kind = "die"
parent = "s1"
[[topology.domains]]
id = "n0"
kind = "numa"
parent = "s0.d0"
numa_nodes = [0]
[[topology.domains]]
id = "n1"
kind = "numa"
parent = "s0.d0"
numa_nodes = [1]
[[topology.domains]]
id = "n2"
kind = "numa"
parent = "s1.d0"
numa_nodes = [2]
[[topology.domains]]
id = "n3"
kind = "numa"
parent = "s1.d0"
numa_nodes = [3]
[[topology.links]]
a = "s0"
b = "s1"
resource = "socket-link"
[[resources]]
id = "socket-link"
kind = "link"
basis = "payload_bytes"
# capacity_GBps omitted until independently specified/measured. Sharing the
# same resource identity means flows contend; it never means independent BW.
[[resources]]
id = "ddr-s0"
kind = "memory"
basis = "read_write_bytes"
[[memory.pools]]
id = "dram-s0"
kind = "dram"
owner = "s0.d0"
os_nodes = [0, 1]
resource = "ddr-s0"
# Optional HBM/CXL pools belong to their actual ownership domain, e.g. n0.
# [[memory.pools]]
# id="hbm0"
# kind="hbm"
# owner="n0"
# os_nodes=[4]
[communication]
algorithm = "auto"
# Explicit modes are the baseline; calibration can select other combinations.
levels = [
  {domain="socket", mode="share"},
  {domain="die", mode="copy"},
  {domain="numa", mode="share"},
]
relay_threshold_bytes = 1048576
chunk_bytes = 262144
# calibration = "routes.json"
