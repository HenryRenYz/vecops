# CPU/HBM relationships are platform data, not model data.
[topology]
schema_version = 1
root = "host0"

[[topology.domains]]
id = "s0"
kind = "socket"
parent = "host0"

[[topology.domains]]
id = "s0.d0"
kind = "die"
parent = "s0"
numa_nodes = [0, 1, 2, 3]

[[resources]]
id = "ddr-controller.s0d0"
kind = "memory"
basis = "read_write_bytes"
# Capacity omitted: no unjustified concurrency/physical-bandwidth assumption.

[[memory.pools]]
id = "ddr.s0d0"
owner = "s0.d0"
kind = "dram"
os_nodes = [0, 1, 2, 3]
resource = "ddr-controller.s0d0"

